[project]
name = "singulax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.2",
    "matplotlib>=3.10.5",
    "scipy==1.17.1",
    "jax==0.10.0",
    "jaxopt>=0.8.5",
    "jaxlib==0.10.0",
    "equinox>=0.11.3",
    "optimistix>=0.0.10",
    "diffrax>=0.6.0",
    "diffeqzoo>=0.0.5",
    "arviz>=0.16",
    "seaborn>=0.13",
    "tqdm==4.67.1",
    "scikit-learn==1.8.0",
    "blackjax==1.5",
    "jupyter>=1.1.1",
    "pytest==8.4.1",
    "sundials4py>=7.7.0",
    "pyproject-toml>=0.1.0",
    "pyqt5>=5.15.11",
    "sympy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedopt"]

[dependency-groups]
dev = ["pytest>=8.4.1",]

[tool.ruff]
line-length = 80

[tool.pytest.ini_options]
pythonpath = "src"

filterwarnings = [
    "ignore:jax\\.interpreters\\.batching\\.NotMapped is deprecated:DeprecationWarning",

    "error",

    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
