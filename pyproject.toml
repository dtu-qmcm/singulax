[project]
name = "singulax"
version = "0.1.0"
description = "Optimization of fed-batch fermentation processes by aplying optimal control theory."
authors = [
    {name = "Ainara Segura Marquez", email="asegma@dtu.dk"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.2",
    "scipy==1.17.1",
    "sympy>=1.14.0",
    "jax==0.10.0",
    "jaxlib==0.10.0",
    "jaxtyping>=0.3.9",
    "equinox>=0.11.3",
    "diffrax>=0.6.0",
    "optimistix>=0.0.10",
    "cyipopt>=1.7.0",
    "matplotlib>=3.10.5",
    "cycler>=0.12",
    "pyqt5>=5.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/singulax"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "jupyter>=1.1.1",
]

[tool.ruff]
line-length = 80

[tool.pytest.ini_options]
pythonpath = "src"

filterwarnings = [
    "ignore:jax\\.interpreters\\.batching\\.NotMapped is deprecated:DeprecationWarning",

    "error",

    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
